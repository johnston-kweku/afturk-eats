{% extends 'base.html' %}

{% block content %}
    <div class="min-h-screen w-full bg-sand-100 flex items-center justify-center px-4">
        <div class="w-11/12 sm:w-9/12 md:max-w-lg flex flex-col items-center text-center gap-4">

            <div class="relative w-40 h-40 flex items-center justify-center">
                <span class="absolute font-display font-black text-8xl text-cyprus-700/10 select-none">
                    404
                </span>
                <div class="relative w-24 h-24 rounded-full bg-cyprus-700/5 flex items-center justify-center">
                    <svg class="w-10 h-10 text-cyprus-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                </div>
            </div>

            <h1 class="font-display text-cyprus-700 font-bold text-2xl md:text-3xl">
                Page not found
            </h1>

            <p class="text-cyprus-900/60 font-sans text-base">
                We couldn't find what you were looking for. The page may have moved or the link is broken.
            </p>

            <a href="{% url 'accounts:home' %}" class="w-full bg-cyprus-700 text-sand-100 font-display font-bold rounded-xl py-4 mt-2 hover:bg-cyprus-800 transition-colors">
                Back to Home
            </a>

        </div>
    </div>

{% endblock content %}
