{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>afturk-eats</title>
    <link rel="stylesheet" href="{% static 'src/css/style.css' %}">
    <link rel="shortcut icon" href="{% static 'assets/favicon.png' %}" type="image/x-icon">
</head>
<body class="bg-linear-to-b from-cyprus-800 select-none font-sans to-cyprus-600 pt-8 pb-24 flex items-center justify-center min-h-screen">
    {% include '_desktop_nav_bar.html' %}
    {% include '_mobile_nav_bar.html' %}
    {% if request.user.is_authenticated %}
        {% include '_online_status.html' %}
    {% endif %}

    <div id="toast-container" class="fixed top-4 right-4 z-100 flex flex-col gap-2 w-[90%] max-w-sm"></div>

    <script id="django-messages" type="application/json">{{ toast_messages_json|safe }}</script>

    <script src="{% static 'src/js/base/base.js' %}"></script>
    <script src="{% static 'src/js/base/toast.js' %}"></script>
    {% block content %}{% endblock content %}
</body>
</html>
