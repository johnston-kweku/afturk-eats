{% extends 'base.html' %}

{% block content %}
    <div class="w-11/12 sm:w-9/12 md:max-w-96 flex flex-col">
        <span class="text-sand-100  mb-3 font-bold w-full flex flex-col gap-2 items-center justify-center">
            <span class="flex items-center gap-0 font-display">
                <p class="text-sand-100 font-bold text-base">afturk</p><span class="text-white/20 font-bold">eats</span><svg class="w-10 h-10 animate-ping" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#f0ede4"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M12 9.5C13.3807 9.5 14.5 10.6193 14.5 12C14.5 13.3807 13.3807 14.5 12 14.5C10.6193 14.5 9.5 13.3807 9.5 12C9.5 10.6193 10.6193 9.5 12 9.5Z" fill="#004741"></path> </g></svg>
            </span>
            <p class="font-display text-3xl md:text-4xl">
                Customer Sign Up
            </p>
            <p class="text-sand-100/40 font-light text-sm">
                Order food anywhere in Tarkwa
            </p>
        </span>

        <!-- Sign up form -->
        <form method="post" class="w-full border border-sand-200/10 bg-white/10 backdrop-blur-md flex flex-col rounded-2xl px-3 py-4">
            {% csrf_token %}
            <span class="flex-col gap-4 w-full items-center">
                <span class="flex flex-col w-full">
                    <label for="first_name" class="text-sm font-light text-sand-100">First Name <span class="text-cyprus-700">*</span></label>
                    <input type="text" name="first_name" id="first_name" placeholder="Justin" class="outline-none border focus:ring-1 focus:ring-sand-100/30 border-sand-200/10 rounded-xl px-2 py-3 w-full placeholder:text-sand-100/30 text-sand-100 placeholder:text-sm caret-sand-100 placeholder:font-light">
                </span>
                <span class="flex flex-col w-full">
                    <label for="last_name" class="text-sm font-light text-sand-100">Last Name</label>
                    <input type="text" name="last_name" id="last_name" placeholder="Mensah" class="outline-none border focus:ring-1 focus:ring-sand-100/30 border-sand-200/10 rounded-xl px-2 py-3 w-full placeholder:text-sand-100/30 text-sand-100 placeholder:text-sm caret-sand-100 placeholder:font-light">
                </span>
            </span>
        </form>
    </div>

{% endblock content %}
