{% extends 'base.html' %}

{% block content %}
    <div class="min-h-screen w-full bg-cyprus-700 flex items-center justify-center px-4">
        <div class="w-11/12 sm:w-9/12 md:max-w-lg flex flex-col items-center text-center gap-4">

            <div class="w-24 h-24 rounded-full bg-sand-100/10 flex items-center justify-center">
                <svg class="w-10 h-10 text-sand-100" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-8.25 3.75h.008v.008h-.008v-.008z" />
                </svg>
            </div>

            <h1 class="font-display text-sand-100 font-bold text-2xl md:text-3xl">
                Invite link invalid
            </h1>

            <p class="text-sand-100/60 font-sans text-base">
                This link has expired, already been used, or doesn't exist. Ask the person who sent it to generate a new one.
            </p>

            <a href="{% url 'accounts:login' %}" class="w-full bg-sand-100 text-cyprus-700 font-display font-bold rounded-xl py-4 mt-2 hover:bg-sand-200 transition-colors">
                Go to Log In
            </a>

        </div>
    </div>

{% endblock content %}
