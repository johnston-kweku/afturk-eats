{% extends 'base.html' %}
{% block title %}Settings{% endblock %}

{% block content %}
<div class="min-h-screen w-full px-4 py-12 ">
  <div class="max-w-xl mx-auto">

    <h1 class="font-display text-2xl font-semibold text-sand-100 mb-6">Settings</h1>

    <div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-lg border border-sand-100/20 divide-y divide-sand-100/15">

      <a href="{% url 'accounts:update_personal_info' %}" class="flex items-center justify-between px-6 py-5 rounded-t-2xl hover:bg-white/10 transition-colors">
        <span class="text-sand-100 font-medium">Personal Information</span>
        <span class="text-sand-100/50">&rsaquo;</span>
      </a>

      <a href="{% url 'accounts:reset_password' %}?next={{ request.path }}" class="flex items-center justify-between rounded-b-2xl px-6 py-5 hover:bg-white/10 transition-colors">
        <span class="text-sand-100 font-medium">Change Password</span>
        <span class="text-sand-100/50">&rsaquo;</span>
      </a>

    </div>
  </div>
</div>
{% endblock %}
